<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Guided 3D training demo: a main landing gear wheel change where each step unlocks only when you do it correctly.">
<meta name="theme-color" content="#141A20">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AMM Trainer">
<title>AMM Step Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: hangar-floor 3D stage on the left, AMM task card on the right (stacked under the stage on phones).
   Cockpit colour logic: cyan = active / selectable, green = done, amber = CAUTION, red = WARNING, magenta = hint target. */
:root{
  color-scheme:dark;
  --bg:#0D1013; --panel:#141A20; --panel2:#1B222A; --line:#2A333D; --ink:#E7ECEF; --muted:#8F9CA8;
  --cyan:#4FD1E8; --green:#47C27C; --amber:#F2B531; --red:#F0544F; --magenta:#D96BE6;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.mono{font-family:var(--font-mono)}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
header{display:flex;align-items:center;gap:10px;padding:9px clamp(12px,2vw,20px);background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.mark{font-family:var(--font-display);font-weight:600;font-size:1rem;background:var(--amber);color:#16120a;padding:1px 7px;border-radius:3px;letter-spacing:.06em;flex:none}
.ttl{display:block;font-family:var(--font-display);font-weight:600;font-size:1.22rem;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:block;font-family:var(--font-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:500;font-size:.88rem;flex:none}
.hbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hbtn.vr-on{border-color:var(--cyan);color:var(--cyan)}
.hbtn.icon{width:36px;padding:0;justify-content:center}

.main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
.stage{position:relative;min-height:0;min-width:0;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas.over{cursor:pointer}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 transparent;transition:box-shadow .35s}
.stage.flash-err::after{box-shadow:inset 0 0 0 3px var(--red),inset 0 0 60px rgba(240,84,79,.25)}
.stage.flash-ok::after{box-shadow:inset 0 0 0 3px var(--green),inset 0 0 60px rgba(71,194,124,.2)}
.demo-chip{position:absolute;left:12px;top:12px;font-family:var(--font-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);background:rgba(13,16,19,.78);border:1px solid rgba(242,181,49,.45);padding:4px 8px;border-radius:4px;pointer-events:none}
.help{position:absolute;right:12px;top:12px;font-size:.78rem;color:var(--muted);background:rgba(13,16,19,.78);border:1px solid var(--line);padding:4px 9px;border-radius:4px;pointer-events:none;transition:opacity .4s}
.help.gone{opacity:0}
.tip{position:absolute;pointer-events:none;background:rgba(13,16,19,.92);border:1px solid var(--line);color:var(--ink);font-size:.78rem;padding:3px 8px;border-radius:4px;white-space:nowrap;transform:translate(12px,12px)}
.tools{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 12px;background:linear-gradient(to top,rgba(13,16,19,.94) 55%,rgba(13,16,19,0));overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool-row{display:flex;gap:8px;width:max-content;margin-inline:auto}
.tool-label{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:2px;writing-mode:vertical-rl;transform:rotate(180deg)}
.tool{display:grid;justify-items:center;gap:3px;width:74px;padding:8px 4px 7px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;font-size:.72rem;line-height:1.15;font-weight:500;color:var(--muted)}
.tool svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{color:var(--ink)}
.tool[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);background:rgba(79,209,232,.08)}

.panel{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-left:1px solid var(--line)}
.pscroll{flex:1;min-height:0;overflow-y:auto;padding:18px 20px 16px;display:grid;gap:14px;align-content:start}
.prog{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px}
.prog i{height:4px;border-radius:2px;background:var(--line)}
.prog i.done{background:var(--green)}
.prog i.cur{background:var(--cyan)}
.ref{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan)}
.step-title{margin:0;font-family:var(--font-display);font-weight:600;font-size:1.85rem;line-height:1.02;text-wrap:balance}
.instr{margin:0;max-width:60ch}
.callout{border:1.5px solid var(--line);border-radius:6px;padding:9px 12px;font-size:.9rem}
.callout b{display:block;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.14em;margin-bottom:2px}
.callout.warning{border-color:var(--red)}.callout.warning b{color:var(--red)}
.callout.caution{border-color:var(--amber)}.callout.caution b{color:var(--amber)}
.callout.note b{color:var(--muted)}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);cursor:pointer;font-size:.93rem}
.opt input{width:18px;height:18px;margin:.15rem 0 0;accent-color:var(--cyan);flex:none}
.opt:has(input:checked){border-color:var(--cyan)}
.check-btn{justify-self:start}
.torque{display:grid;gap:8px}
.torque p{margin:0;font-size:.86rem;color:var(--muted)}
.tq-row{display:flex;flex-wrap:wrap;gap:7px}
.tq{padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel2);cursor:pointer;font-family:var(--font-mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.tq[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
details.box{border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
details.box summary{cursor:pointer;padding:9px 12px;font-weight:600;font-size:.9rem;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.box summary::-webkit-details-marker{display:none}
details.box summary::after{content:"+";font-family:var(--font-mono);color:var(--muted)}
details.box[open] summary::after{content:"\2212"}
.box-body{padding:2px 12px 12px;display:grid;gap:8px;font-size:.88rem}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px}
.kv dt{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:.15rem}
.kv dd{margin:0}
.data-hi{color:var(--cyan);font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.small{font-size:.8rem;color:var(--muted)}
.steplist{list-style:none;margin:0;padding:0;display:grid}
.steplist li{display:grid;grid-template-columns:26px 1fr 18px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:.88rem;color:var(--muted)}
.steplist li:first-child{border-top:0}
.steplist .n{font-family:var(--font-mono);font-size:.72rem;font-variant-numeric:tabular-nums}
.steplist li.done{color:var(--ink)}
.steplist li.cur{color:var(--cyan);font-weight:600}
.steplist svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.steplist li.done svg{color:var(--green)}
.pfoot{border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;background:var(--panel)}
.fb{display:flex;gap:8px;align-items:flex-start;min-height:2.9em;font-size:.92rem;margin:0}
.fb::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:.45em;background:var(--muted)}
.fb.ok{color:var(--green)}.fb.ok::before{background:var(--green)}
.fb.err{color:var(--red)}.fb.err::before{background:var(--red)}
.fb.info{color:var(--ink)}.fb.info::before{background:var(--cyan)}
.btns{display:grid;grid-template-columns:auto 1fr;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600;font-size:.93rem}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.next{background:var(--green);border-color:var(--green);color:#06140c}
.btn.next:disabled{background:var(--panel2);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.btn.ghost-cyan{border-color:var(--cyan);color:var(--cyan);background:transparent}
.stats{display:flex;gap:14px;font-family:var(--font-mono);font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.done-card{display:grid;gap:12px}
.done-card p{margin:0}
.done-card .big{font-family:var(--font-display);font-weight:600;font-size:2.4rem;line-height:1;color:var(--green)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles div{border:1px solid var(--line);border-radius:6px;padding:9px 10px;background:var(--panel2)}
.tiles b{display:block;font-family:var(--font-mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.tiles span{font-size:.75rem;color:var(--muted)}

@media (max-width:820px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,48%)}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .pscroll{padding:14px 16px 12px;gap:12px}
  .pfoot{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));gap:8px}
  .step-title{font-size:1.55rem}
  .help{display:none}
  .tool{width:66px}
  .fb{min-height:2.6em;font-size:.88rem}
}
@media (max-width:480px){.sub{display:none}.hbtn .vr-label{display:none}.hbtn.vr{width:36px;padding:0;justify-content:center}}
@media (prefers-reduced-motion:reduce){.stage::after,.help{transition:none}}
</style>
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>


<div class="app">
  <header>
    <div class="brand">
      <span class="mark">AMM</span>
      <span style="min-width:0"><span class="ttl">Main gear wheel change</span><span class="sub">Task 32-41 · guided step trainer</span></span>
    </div>
    <button class="hbtn" id="installBtn" type="button" hidden title="Install as an app">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>
      <span class="vr-label">Install</span>
    </button>
    <button class="hbtn vr" id="vrBtn" type="button" title="View in a VR headset">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h18v8a2 2 0 0 1-2 2h-3.5l-2-2.5h-3l-2 2.5H5a2 2 0 0 1-2-2z"/><circle cx="8" cy="12.5" r="1.6"/><circle cx="16" cy="12.5" r="1.6"/></svg>
      <span class="vr-label">VR</span>
    </button>
    <button class="hbtn icon" id="restartBtn" type="button" title="Restart task" aria-label="Restart task">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/></svg>
    </button>
  </header>

  <div class="main">
    <div class="stage" id="stage">
      <span class="demo-chip">Training demo · illustrative steps</span>
      <span class="help" id="help">Drag to look around · scroll or pinch to zoom · click parts</span>
      <div class="tip" id="tip" hidden></div>
      <div class="tools"><div class="tool-row" id="tools" role="group" aria-label="Tool tray"></div></div>
    </div>

    <aside class="panel" aria-label="Task card">
      <div class="pscroll" id="pscroll"></div>
      <div class="pfoot">
        <p class="fb info" id="fb" role="status" aria-live="polite">Choose a tool, then click the part.</p>
        <div class="btns">
          <button class="btn" type="button" id="hintBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Hint</button>
          <button class="btn next" type="button" id="nextBtn" disabled></button>
        </div>
        <div class="stats" id="stats"></div>
      </div>
    </aside>
  </div>
</div>

<script src="three.min.js"></script>
<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const ease = k => k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;

/* ---------- Tools, task data, steps ---------- */
const TOOLS = [
  {id:"hand", name:"Hands", icon:'<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11V4a1.5 1.5 0 0 1 3 0v7M14 11V5.5a1.5 1.5 0 0 1 3 0V13M17 12a1.5 1.5 0 0 1 3 0v3a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8L3.5 15a1.5 1.5 0 0 1 2.3-1.9L8 15"/>'},
  {id:"torch", name:"Inspection torch", short:"Torch", icon:'<path d="M7 3h10l-2 6v12H9V9z"/><path d="M9 9h6"/><path d="M12 13v3"/>'},
  {id:"driver", name:"Screwdriver", icon:'<path d="M14.5 3.5l6 6-3.5 3.5-6-6z"/><path d="M12.8 9.7L4 18.5 5.5 20l8.8-8.8"/>'},
  {id:"socket", name:"Socket wrench", short:"Socket wrench", icon:'<path d="M4 20l9-9"/><circle cx="16" cy="8" r="4.2"/><circle cx="16" cy="8" r="1.6"/>'},
  {id:"axlesocket", name:"Axle nut socket", short:"Axle nut socket", icon:'<path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z"/><circle cx="12" cy="12" r="3.4"/>'},
  {id:"torque", name:"Torque wrench", short:"Torque wrench", icon:'<path d="M3 21l11-11"/><circle cx="17" cy="7" r="3.6"/><path d="M5.5 14.5l4 4"/><circle cx="7.5" cy="16.5" r=".6"/>'}
];
const toolName = id => (TOOLS.find(t=>t.id===id)||{name:id}).name;
const NUT_TORQUE = 150;

const NAMES = {cut:"cut in the tread", wheel:"outboard wheel and tire", spare:"replacement wheel on the dolly", oldwheel:"removed wheel",
  inboardWheel:"inboard wheel", brake:"brake assembly", jack:"axle jack", hubcap:"hubcap", lockbolt:"axle nut lock bolt", axlenut:"axle nut",
  axle:"axle", strut:"shock strut", wing:"wing lower surface", fuselage:"fuselage", dolly:"wheel dolly", pin:"ground lock pin streamer", screw:"hubcap screw"};
const nameOf = id => NAMES[id && id.startsWith("screw-") ? "screw" : id] || "part";

const lift = () => W.aircraft ? W.aircraft.position.y : 0;
const camNut  = () => ({t:[0.2,0.62+lift(),0], r:0.95, th:1.2, ph:1.25});
const camLock = () => ({t:[0.2,0.68+lift(),0], r:0.75, th:1.15, ph:0.95});
const camCap  = () => ({t:[0.27,0.62+lift(),0], r:1.05, th:1.25, ph:1.3});
const camJack = () => ({t:[-0.9,0.5,0.35], r:2.9, th:0.25, ph:1.18});

const STEPS = [
  {phase:"Inspection", title:"Find the tire damage", kind:"pick", tool:"torch", target:"cut",
   text:"A walk-around found a problem with the outboard wheel on this main gear. Select the inspection torch, then click the damage that makes this wheel change necessary.",
   note:"A cut that shows the tire cords is beyond limits.",
   wrong:"Look along the tread of the outboard tire.",
   success:"Cut found. The cords are showing, so the wheel and tire assembly must be replaced.",
   cam:()=>({t:[0.05,0.78,0.15], r:2.0, th:0.45, ph:1.12}), run:()=>Promise.resolve()},
  {phase:"Preparation", title:"Make the aircraft safe", kind:"quiz",
   text:"Before you jack the aircraft, tick every precaution that applies, then press Check.",
   warn:"Make sure the landing gear ground lock pins are installed before you jack the aircraft. If the gear retracts, it can kill or injure persons.",
   options:[
     {id:"a", t:"Install the landing gear ground lock pins", ok:true},
     {id:"b", t:"Put chocks at the wheels of the other main gear", ok:true},
     {id:"c", t:"Put a DO NOT OPERATE tag on the brake controls", ok:true},
     {id:"d", t:"Inflate the tire to maximum pressure before jacking", ok:false},
     {id:"e", t:"Remove the ground lock pins so the gear can move freely", ok:false}],
   hintText:"Think about what stops the gear retracting, what stops the aircraft rolling, and who could operate the brakes.",
   success:"Aircraft made safe. Ground lock pins in, other gear chocked, brake controls tagged.",
   cam:()=>({t:[-0.6,1.0,0], r:4.4, th:0.7, ph:1.15}), run:()=>{ W.pin.visible = true; return Promise.resolve(); }},
  {phase:"Preparation", title:"Jack the axle", kind:"pick", tool:"hand", target:"jack",
   text:"Move the axle jack under the jacking point, then raise it until the tire is just clear of the floor. Click the axle jack.",
   caution:"Lift only until the tire clears the floor. Do not jack higher than necessary.",
   wrong:"This step needs the yellow axle jack.",
   success:"Axle raised. The tire is clear of the floor.", cam:camJack, run:()=>jackUp()},
  {phase:"Removal", title:"Remove the hubcap screws", kind:"pickAll", tool:"driver", target:"screw", count:6,
   text:"Use the screwdriver to remove the six screws that hold the hubcap. Click each screw.",
   wrong:"The screws are on the face of the hubcap, at the centre of the wheel.",
   success:"All six screws removed. Keep them with the hubcap.", cam:camCap, each:p=>unscrew(p)},
  {phase:"Removal", title:"Remove the hubcap", kind:"pick", tool:"hand", target:"hubcap",
   text:"Pull the hubcap straight off the wheel hub.",
   success:"Hubcap removed. The axle nut and its lock bolt are now visible.", cam:camCap, run:()=>removeHubcap()},
  {phase:"Removal", title:"Remove the axle nut lock bolt", kind:"pick", tool:"socket", target:"lockbolt",
   text:"Use the socket wrench to remove the bolt that locks the axle nut.",
   wrong:"The lock bolt goes through the top of the axle nut.",
   success:"Lock bolt removed. The axle nut is free to turn.", cam:camLock, run:()=>removeLockBolt()},
  {phase:"Removal", title:"Remove the axle nut", kind:"pick", tool:"axlesocket", target:"axlenut",
   text:"Use the axle nut socket to remove the axle nut.",
   caution:"Support the weight of the wheel while you remove the nut, so the axle threads are not damaged.",
   success:"Axle nut removed.", cam:camNut, run:()=>removeNut()},
  {phase:"Removal", title:"Remove the wheel", kind:"pick", tool:"hand", target:"wheel",
   text:"Pull the wheel and tire assembly straight off the axle and put it aside.",
   caution:"Keep the wheel square to the axle as it comes off. Do not let it drag on the axle threads.",
   success:"Wheel removed. Tag it unserviceable and send it to the tire shop.",
   cam:()=>({t:[0.4,0.66,0.1], r:3.0, th:0.95, ph:1.2}), run:()=>removeWheel()},
  {phase:"Installation", title:"Fit the replacement wheel", kind:"pick", tool:"hand", target:"spare",
   text:"Take the replacement wheel from the dolly and push it onto the axle.",
   note:"Line up the wheel drive keys with the brake rotor slots before you push the wheel fully on.",
   wrong:"The replacement wheel is on the blue dolly.",
   success:"Replacement wheel fitted on the axle.",
   cam:()=>({t:[0.9,0.62,0.6], r:3.3, th:0.8, ph:1.15}), run:()=>fitSpare()},
  {phase:"Installation", title:"Install and torque the axle nut", kind:"torque", tool:"torque", target:"axlenut", answer:NUT_TORQUE, values:[110,150,190,230],
   text:"Install the axle nut. Set the torque wrench to the axle nut torque given in Job set-up, then click the axle nut.",
   success:"Axle nut torqued to "+NUT_TORQUE+" lbf·ft.", cam:camNut, enter:()=>{ W.nutGhost.visible = true; }, run:()=>installNut()},
  {phase:"Installation", title:"Install the lock bolt", kind:"pick", tool:"socket", target:"lockbolt",
   text:"Use the socket wrench to install the lock bolt through the axle nut.",
   success:"Lock bolt installed. The axle nut is locked.", cam:camLock, enter:()=>{ W.lockGhost.visible = true; }, run:()=>installLockBolt()},
  {phase:"Installation", title:"Install the hubcap", kind:"pick", tool:"driver", target:"hubcap",
   text:"Put the hubcap on the hub and install its six screws with the screwdriver.",

function ghostOf(obj, part){
  const g = obj.clone(true);

function setRam(top){ W.ram.scale.y = Math.max(0.01, top - 0.41); W.pad.position.y = top - 0.015; W.ramTop = top; }

/* ---------- Tweens ---------- */
const tweens = [];
function tween(ms, fn){ return new Promise(res=>{ tweens.push({t0:performance.now(), ms, fn, res}); }); }
function runTweens(now){
  for (let i=tweens.length-1;i>=0;i--){ const tw=tweens[i]; const k=Math.min(1,(now-tw.t0)/tw.ms); tw.fn(ease(k), k); if(k>=1){ tweens.splice(i,1); tw.res(); } }
}
const lerp = (a,b,k) => a+(b-a)*k;

/* ---------- Step animations ---------- */
const DOME = 0.505, LIFT = 0.08;
async function jackUp(){
  const j = W.jack, z0 = j.position.z;
  await tween(650, k=>{ j.position.z = lerp(z0, 0, k); });
  const r0 = W.ramTop;
  await tween(450, k=>setRam(lerp(r0, DOME, k)));
  await tween(900, k=>{ W.aircraft.position.y = lerp(0, LIFT, k); setRam(DOME + W.aircraft.position.y); });
}
async function jackDown(){
  const y0 = W.aircraft.position.y;
  await tween(900, k=>{ W.aircraft.position.y = lerp(y0, 0, k); setRam(DOME + W.aircraft.position.y); });
  const r0 = W.ramTop;
  await tween(400, k=>setRam(lerp(r0, 0.44, k)));
  const j = W.jack; await tween(650, k=>{ j.position.z = lerp(0, 0.95, k); });
}
async function unscrew(s){
  const x0 = s.position.x;
  await tween(520, k=>{ s.position.x = x0 + 0.06*k; s.rotation.x = k*Math.PI*4; });
  s.visible = false;
}
async function removeHubcap(){
  const c = W.cap, x0 = c.position.x;
  await tween(700, k=>{ c.position.x = x0 + 0.4*k; c.position.y = 0.62 - 0.1*k*k; });
  c.visible = false;
}
async function removeLockBolt(){
  const b = W.lock, y0 = b.position.y;

async function removeNut(){

async function removeWheel(){

async function fitSpare(){

async function installNut(){

async function installHubcap(){

/* ---------- Camera orbit ---------- */
const orbit = {t:new THREE.Vector3(-0.6,1.0,0), r:4.4, th:0.7, ph:1.15};
function applyOrbit(){
  if (renderer.xr.isPresenting) return;
  const {t,r,th,ph} = orbit, sp = Math.sin(ph);
  camera.position.set(t.x + r*sp*Math.sin(th), clamp(t.y + r*Math.cos(ph), 0.12, 3.35), t.z + r*sp*Math.cos(th));
  camera.lookAt(t);
}
let flying = 0;
function flyTo(c){
  const a = {t:orbit.t.clone(), r:orbit.r, th:orbit.th, ph:orbit.ph};
  const bT = new THREE.Vector3(c.t[0],c.t[1],c.t[2]);
  let dth = c.th - a.th; dth = Math.atan2(Math.sin(dth), Math.cos(dth));
  const id = ++flying;
  return tween(800, k=>{ if(id!==flying) return; orbit.t.lerpVectors(a.t, bT, k); orbit.r = lerp(a.r, c.r, k); orbit.th = a.th + dth*k; orbit.ph = lerp(a.ph, c.ph, k); applyOrbit(); });
}

function resize(){
  const r = stage.getBoundingClientRect();
  if (!r.width || !r.height) return;
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

/* ---------- Picking ---------- */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function visibleChain(o){ while(o){ if(!o.visible) return false; o = o.parent; } return true; }
function partOf(o){
  while(o){
    const p = o.userData && o.userData.part;
    if(p && !(p==="cut" && S.i!==0)) return o; // after step 1 the cut is just part of the wheel
    o = o.parent;
  }
  return null;
}
function firstPart(){
  const hits = raycaster.intersectObject(world, true);
  for (const h of hits){ if(!visibleChain(h.object)) continue; const p = partOf(h.object); if(p) return {obj:p, d:h.distance}; }
  return null;
}
function rayFromClient(x,y){ const r = canvas.getBoundingClientRect(); ndc.set(((x-r.left)/r.width)*2-1, -((y-r.top)/r.height)*2+1); raycaster.setFromCamera(ndc, camera); }

/* ---------- Highlight (hints) ---------- */
let hl = null;
function findParts(id){
  const out = [];
  world.traverse(o=>{ const p = o.userData && o.userData.part; if(!p) return; if((id==="screw" ? p.startsWith("screw-") : p===id) && visibleChain(o)) out.push(o); });
  return out;
}
function clearHighlight(){
  if(!hl) return;
  for (const m of hl.meshes){ if(m.material.emissive) m.material.emissive.setRGB(0,0,0); else if(m.material===ghostMat) ghostMat.opacity = .32; }
  hl = null;
}
function highlight(objs){
  clearHighlight();
  const meshes = [];
  for (const o of objs) o.traverse(m=>{ if(m.isMesh && m.material!==proxyMat) meshes.push(m); });
  hl = {meshes, until: performance.now()+3200};
}
function updateHighlight(now){
  if(!hl) return;
  if(now > hl.until){ clearHighlight(); return; }
  const k = (Math.sin(now/140)+1)/2;
  for (const m of hl.meshes){ if(m.material.emissive) m.material.emissive.setRGB(0.85*k, 0.42*k, 0.9*k); else if(m.material===ghostMat) ghostMat.opacity = .25 + .45*k; }
}

/* ---------- Feedback ---------- */
function say(kind, text){
  S.msg = {kind, text};
  const fb = $("fb"); fb.className = "fb " + kind; fb.textContent = text;
  if(kind==="err" || kind==="ok"){ stage.classList.remove("flash-err","flash-ok"); void stage.offsetWidth; stage.classList.add(kind==="err"?"flash-err":"flash-ok"); setTimeout(()=>stage.classList.remove("flash-err","flash-ok"), 650); }
  drawBoard();
}
function addError(){ S.errors++; S.stepErrors[S.i] = (S.stepErrors[S.i]||0)+1; updateStats(); }

/* ---------- Core interaction ---------- */
async function onPick(hit){
  if(S.busy || S.finished || !hit) return;
  const id = hit.obj.userData.part, st = STEPS[S.i], nm = nameOf(id);
  if(S.done){ say("info", "That's the "+nm+". This step is done, press Next step to continue."); return; }
  if(st.kind==="quiz"){ say("info", "That's the "+nm+". Answer the precautions in the task card first."); return; }
  const isTarget = st.kind==="pickAll" ? (id.startsWith("screw-") && !S.picked.has(id)) : id===st.target;
  if(!isTarget){
    addError();
    let extra = st.wrong || "Read the step again and find the right part.";
    if(id==="oldwheel") extra = "That wheel is coming off the aircraft. " + extra;
    say("err", "That's the "+nm+", not the part for this step. "+extra);
    return;
  }
  if(S.tool!==st.tool){
    addError();
    say("err", "Wrong tool for the "+nm+". "+(S.tool==="hand" ? "You can't do this by hand." : toolName(S.tool)+" won't do this job.")+" Pick the tool the step asks for.");
    return;
  }
  if(st.kind==="torque" && S.torque!==st.answer){
    if(S.torque==null){ say("err", "Set the torque wrench first. The value is in Job set-up."); return; }
    addError();
    say("err", "The wrench is set to "+S.torque+" lbf·ft. That doesn't match the axle nut torque in Job set-up.");
    return;
  }
  clearHighlight();
  S.busy = true;
  if(st.kind==="pickAll"){
    S.picked.add(id);
    await st.each(hit.obj);
    S.busy = false;
    const left = st.count - S.picked.size;
    if(left>0){ say("ok", "Screw removed. "+left+" to go."); return; }
  } else {
    await st.run(hit.obj);
    S.busy = false;
  }
  complete();
}

function complete(){
  const st = STEPS[S.i];
  S.done = true;
  say("ok", st.success);
  renderSteps(); updateNext(); drawBoard();
  if(S.i === STEPS.length-1){ S.tEnd = performance.now(); }
}

function next(){
  if(!S.done || S.busy) return;
  if(S.i === STEPS.length-1){ finish(); return; }
  S.i++; enterStep();
}

function enterStep(){
  const st = STEPS[S.i];
  S.done = false; S.picked = new Set(); S.torque = null; S.quiz = new Set();
  clearHighlight();
  if(st.enter) st.enter();
  renderCard(); updateNext();
  say("info", st.kind==="quiz" ? "Tick every precaution that applies, then press Check." :
               st.kind==="torque" ? "Pick the torque wrench, set it, then click the axle nut." :
               st.kind==="pickAll" ? "Pick the tool, then click each screw." : "Pick the tool, then click the part.");
  if(!renderer.xr.isPresenting) flyTo(st.cam());
  $("pscroll").scrollTop = 0;
}

function selectTool(id){ S.tool = id; torch.intensity = id==="torch" ? 2.4 : 0; renderTools(); drawBoard(); }
function setTorque(v){ S.torque = v; document.querySelectorAll(".tq").forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.v===v))); drawBoard(); }
function toggleQuiz(id, on){ if(on===undefined) on = !S.quiz.has(id); if(on) S.quiz.add(id); else S.quiz.delete(id); const el = document.querySelector('.opt input[value="'+id+'"]'); if(el) el.checked = on; drawBoard(); }
function checkQuiz(){
  const st = STEPS[S.i]; if(S.done) return;
  const right = st.options.filter(o=>o.ok).map(o=>o.id);
  const wrongPicked = [...S.quiz].filter(id=>!right.includes(id)).length;
  const missing = right.filter(id=>!S.quiz.has(id)).length;
  if(!wrongPicked && !missing){ st.run(); complete(); return; }
  addError();
  const parts = [];
  if(wrongPicked) parts.push(wrongPicked+" selected item"+(wrongPicked>1?"s are":" is")+" wrong");
  if(missing) parts.push(missing+" required precaution"+(missing>1?"s are":" is")+" missing");
  say("err", "Not yet: "+parts.join(" and ")+".");
}
function hint(){
  if(S.finished) return;
  const st = STEPS[S.i];
  if(S.done){ say("info", "This step is done. Press Next step."); return; }
  S.hints++; updateStats();
  if(st.kind==="quiz"){ say("info", "Hint: "+st.hintText); return; }
  const objs = findParts(st.target);
  highlight(objs);
  const target = st.target==="screw" ? "hubcap screws" : nameOf(st.target);
  say("info", "Hint: use the "+toolName(st.tool).toLowerCase()+" on the "+target+" (shown in magenta)." + (st.kind==="torque" ? " The torque value is in Job set-up." : ""));
}

function finish(){
  S.finished = true; if(!S.tEnd) S.tEnd = performance.now();
  renderCard(); updateNext(); renderSteps();
  say("ok", "Task complete. All 13 steps signed off in order.");
  if(!renderer.xr.isPresenting) flyTo({t:[-0.4,0.9,0], r:4.6, th:0.75, ph:1.15});
}

function restart(){
  tweens.length = 0; flying++;
  buildWorld();
  Object.assign(S, {i:0, done:false, tool:"hand", errors:0, hints:0, stepErrors:[], picked:new Set(), torque:null, busy:false, finished:false, t0:performance.now(), tEnd:0});
  selectTool("hand");
  enterStep(); updateStats();
}

/* ---------- Pointer controls ---------- */
const pointers = new Map(); let drag = null, pinch = null;
const tip = $("tip");
function hideHelp(){ $("help").classList.add("gone"); }
canvas.addEventListener("pointerdown", e=>{
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size===1){ drag = {x:e.clientX, y:e.clientY, t:performance.now(), moved:0}; pinch = null; }
  else if(pointers.size===2){ const [a,b] = [...pointers.values()]; pinch = {d:Math.hypot(a.x-b.x,a.y-b.y)||1, r:orbit.r}; drag = null; }
});
canvas.addEventListener("pointermove", e=>{
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pinch && pointers.size===2){ const [a,b] = [...pointers.values()]; const d = Math.hypot(a.x-b.x,a.y-b.y)||1; flying++; orbit.r = clamp(pinch.r*pinch.d/d, 0.45, 5.5); applyOrbit(); hideHelp(); return; }
  if(drag && pointers.size===1){
    const dx = e.clientX-drag.x, dy = e.clientY-drag.y; drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx)+Math.abs(dy);
    if(drag.moved>6){ flying++; orbit.th -= dx*0.007; orbit.ph = clamp(orbit.ph - dy*0.006, 0.7, 1.52); applyOrbit(); hideHelp(); tip.hidden = true; }
    return;
  }
  if(e.pointerType==="mouse") hover(e);
});
function endPointer(e, cancelled){
  const wasTap = !cancelled && drag && drag.moved<=6 && (performance.now()-drag.t)<650 && !pinch && pointers.size===1;
  pointers.delete(e.pointerId);
  if(wasTap){ rayFromClient(e.clientX, e.clientY); onPick(firstPart()); }
  if(pointers.size===0){ drag = null; pinch = null; }
}
canvas.addEventListener("pointerup", e=>endPointer(e,false));
canvas.addEventListener("pointercancel", e=>endPointer(e,true));
canvas.addEventListener("pointerleave", ()=>{ tip.hidden = true; canvas.classList.remove("over"); });
canvas.addEventListener("wheel", e=>{ e.preventDefault(); flying++; orbit.r = clamp(orbit.r*(1+e.deltaY*0.0012), 0.45, 5.5); applyOrbit(); hideHelp(); }, {passive:false});
let hoverQueued = false, lastHover = null;
function hover(e){
  lastHover = e; if(hoverQueued) return; hoverQueued = true;
  requestAnimationFrame(()=>{
    hoverQueued = false; const ev = lastHover;
    rayFromClient(ev.clientX, ev.clientY); const h = firstPart();
    if(h){ const r = stage.getBoundingClientRect(); tip.textContent = nameOf(h.obj.userData.part).replace(/^./, c=>c.toUpperCase()); tip.style.left = (ev.clientX-r.left)+"px"; tip.style.top = (ev.clientY-r.top)+"px"; tip.hidden = false; canvas.classList.add("over"); }
    else { tip.hidden = true; canvas.classList.remove("over"); }
  });
}

function wrapText(c, text, x, y, maxW, lh, maxLines){
  const words = String(text).split(" "); let line = "", lines = 0;
  for (let i=0;i<words.length;i++){
    const test = line ? line+" "+words[i] : words[i];
    if(c.measureText(test).width > maxW && line){ c.fillText(line, x, y); y += lh; lines++; line = words[i]; if(lines>=maxLines-1){ line = words.slice(i).join(" "); break; } }
    else line = test;
  }
  if(line){ let l = line; while(c.measureText(l).width > maxW && l.length>3) l = l.slice(0,-4)+"…"; c.fillText(l, x, y); y += lh; }
  return y;
}
function bButton(x,y,w,h,label,opts,act){

  c.fillStyle = opts.fill || COL.panel; c.fillRect(x,y,w,h);
  c.strokeStyle = opts.stroke || COL.line; c.lineWidth = 3; c.strokeRect(x+1.5,y+1.5,w-3,h-3);
  c.fillStyle = opts.color || COL.ink; c.font = opts.font || '600 26px "IBM Plex Sans", sans-serif'; c.textBaseline = "middle";
  wrapText(c, label, x+16, y+h/2 - (opts.twoLine?14:0), w-28, 30, opts.twoLine?2:1);
  c.textBaseline = "alphabetic";
  if(act) bRects.push({x,y,w,h,act});

function boardHit(uv){ const x = uv.x*BW, y = (1-uv.y)*BH; const r = bRects.find(r=>x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h); if(r) r.act(); }

let xrOK = false;

buildWorld();
renderTools();
resize(); applyOrbit();
enterStep();
updateStats();
checkXR();
renderer.setAnimationLoop(()=>{ const now = performance.now(); runTweens(now); updateHighlight(now); renderer.render(scene, camera); });
window.__trainer = {S, STEPS, W:()=>W, onPick, selectTool, setTorque, toggleQuiz, checkQuiz, next, hint, findParts, drawBoard, board, boardHit:(u,v)=>boardHit({x:u,y:v}), bRects:()=>bRects};
})();

<script>
/* Install button (Android / desktop Chrome and Edge) and offline support */
(function(){
  let deferred = null; const ib = document.getElementById("installBtn");
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; ib.hidden = false; });
  ib.addEventListener("click", async () => { if(!deferred) return; deferred.prompt(); try{ await deferred.userChoice; }catch(_){} deferred = null; ib.hidden = true; });
  window.addEventListener("appinstalled", () => { ib.hidden = true; });
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
